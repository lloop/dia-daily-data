name: Daily DIA scrape

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dia_daily_scraper

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: dia_daily_scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create CI configuration
        run: |
          cp config.example.py config.py
          sed -i 's|https://www.example.com|https://www.dia.es|' config.py
          sed -i 's|/path/to/tomatoes/products|/verduras/tomates-pimientos-y-pepinos/c/L2023|' config.py

      - name: Scrape products
        run: python scraper.py

      - name: Commit updated DB back to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/dia_products.sqlite3
          git commit -m "Update daily price history [skip ci]" || echo "No changes to commit"
          git push origin main