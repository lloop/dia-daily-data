<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Price Changes From DIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard__header">
      <div class="header-layout">
        <div class="header-copy">
          <p class="eyebrow">Daily Price Changes From DIA</p>
          <h1>DIA DAILY DATA</h1>
          <!-- <p class="lede">A live view of products and price snapshots from DIA supermarket.</p> -->
        </div>
        <a class="source-preview" href="{{ source_url }}" target="_blank" rel="noopener noreferrer">
          <img src="{{ fallback_thumbnail_url }}" alt="Preview of the DIA vegetables category page" loading="lazy">
          <span class="source-preview__caption">
            <span class="summary__label">Source page</span>
            <strong>DIA vegetables selection <span aria-hidden="true">↗</span></strong>
          </span>
        </a>
      </div>
    </header>

    <section class="content-grid">
      <div class="panel">
        <div class="panel__heading">
          <h2>Current Tomatoe Prices</h2>
          <span id="status">Loading...</span>
        </div>
        <div id="product-list" class="product-list"></div>
      </div>

      <div class="panel panel--chart">
        <div class="panel__heading">
          <h2 id="chart-title">Tomatoes Comparison</h2>
          <span id="chart-unit"></span>
        </div>
        <svg id="price-chart" role="img" aria-label="Selected product price history"></svg>
        <p id="empty-chart" class="empty-state">Select a product to inspect its price history.</p>
      </div>
    </section>

    <section class="summary" aria-label="Database summary">
      <div><span class="summary__label">Products</span><strong id="product-count">-</strong></div>
      <div><span class="summary__label">Latest scrape</span><strong id="latest-scrape">-</strong></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
